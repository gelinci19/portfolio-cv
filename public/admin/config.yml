backend:
  name: github
  repo: gelinci19/portfolio-cv
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "site_content"
    label: "Website Content"
    files:
      - file: "src/data/home.json"
        label: "Home & Profile Data"
        name: "home"
        fields:
          - {label: "Full Name", name: "name", widget: "string"}
          - {label: "Webpage Title", name: "webpageTitle", widget: "string"}
          - {label: "Job Title", name: "jobTitle", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Availability Status", name: "availability", widget: "string"}
          - {label: "Profile Photo", name: "photoUrl", widget: "image"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Resume URL", name: "resumeUrl", widget: "string"}

      - file: "src/data/career.json"
        label: "Career History"
        name: "career"
        fields:
          - label: "Career Positions"
            name: "career"
            widget: "list"
            summary: "{{fields.title}} at {{fields.company}}"
            fields:
              - {label: "Job Title", name: "title", widget: "string"}
              - {label: "Company", name: "company", widget: "string"}
              - {label: "Company URL", name: "url", widget: "string", required: false}
              - {label: "Location", name: "location", widget: "string", required: false}
              - {label: "Start Date", name: "startDate", widget: "string"}
              - {label: "End Date", name: "endDate", widget: "string"}
              - {label: "Job Type", name: "type", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Tags / Skills"
                name: "tags"
                widget: "list"
                field: {label: "Tag", name: "tag", widget: "string"}

      - file: "src/data/projects.json"
        label: "Projects"
        name: "projects"
        fields:
          - label: "Project Items"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Project Title", name: "title", widget: "string"}
              - {label: "Project Image", name: "image", widget: "image"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Date", name: "date", widget: "string"}

      - file: "src/data/tech.json"
        label: "Technologies / Tech Stack"
        name: "tech"
        fields:
          - label: "Tech Categories or Items"
            name: "tech"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title / Category", name: "title", widget: "string"}
              - label: "Items"
                name: "items"
                widget: "list"
                field: {label: "Name", name: "name", widget: "string"}
