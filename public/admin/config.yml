backend:
  name: github
  repo: gelinci19/portfolio-cv
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  # 1. SITE SETTINGS: Control Global Branding, Colors, and Links
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/content/settings/general.json"
        label: "Global Config"
        name: "general"
        fields:
          - {label: "Site Title", name: "title", widget: "string"}
          - {label: "Primary Color", name: "primaryColor", widget: "color"}
          - {label: "Site Logo", name: "logo", widget: "image"}
          - {label: "Social Links", name: "social", widget: "list", fields: [{label: "Platform", name: "platform", widget: "string"}, {label: "URL", name: "url", widget: "string"}]}

  # 2. HOMEPAGE: Full layout control
  - name: "home"
    label: "Homepage"
    files:
      - file: "src/content/home/index.md"
        label: "Home Page Content"
        name: "home"
        fields:
          - {label: "Hero Heading", name: "heading", widget: "string"}
          - {label: "Hero Subtext", name: "subtext", widget: "text"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - {label: "Enable Theme Toggle", name: "showToggle", widget: "boolean", default: true}

  # 3. PROJECTS: Unlimited creation/editing capacity
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Project Image", name: "image", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Date", name: "date", widget: "datetime"}
