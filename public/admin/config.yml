backend:
  name: github
  repo: gelinci19/portfolio-cv
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Website Content"
    files:
      - file: "src/data/home.json"
        label: "Home & Profile Data"
        name: "home"
        fields:
          - {label: "Full Name", name: "name", widget: "string"}
          - {label: "Webpage Title", name: "webpageTitle", widget: "string"}
          - {label: "Job Title", name: "jobTitle", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Availability Status", name: "availability", widget: "string"}
          - {label: "Profile Photo", name: "photoUrl", widget: "image"}
          - {label: "Description (Plain Text)", name: "description", widget: "text"}
          - {label: "Description (HTML)", name: "descriptionHtml", widget: "text"}
          - {label: "Resume URL / File", name: "resumeUrl", widget: "string"}
          - {label: "SEO Keywords", name: "keywords", widget: "string"}
          - label: "Social Media Links"
            name: "socials"
            widget: "list"
            fields:
              - {label: "Platform Name", name: "name", widget: "string"}
              - {label: "Profile URL", name: "url", widget: "string"}
              - {label: "Icon Identifier", name: "icon", widget: "string"}
              - {label: "Button Label", name: "label", widget: "string"}
              - {label: "Show in Contact Section", name: "showInContact", widget: "boolean"}


  # 2. HOMEPAGE: Full layout control
  - name: "home"
    label: "Homepage"
    files:
      - file: "src/content/home/index.md"
        label: "Home Page Content"
        name: "home"
        fields:
          - {label: "Hero Heading", name: "heading", widget: "string"}
          - {label: "Hero Subtext", name: "subtext", widget: "text"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - {label: "Enable Theme Toggle", name: "showToggle", widget: "boolean", default: true}

  # 3. PROJECTS: Unlimited creation/editing capacity
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Project Image", name: "image", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Date", name: "date", widget: "datetime"}
