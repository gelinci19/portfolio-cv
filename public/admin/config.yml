backend:
  name: github
  repo: gelinci19/portfolio-cv
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "site_data"
    label: "Website Data Files"
    files:
      - file: "src/data/home.json"
        label: "Home & Profile Data"
        name: "home_data"
        fields:
          - {label: "Full Name", name: "name", widget: "string"}
          - {label: "Webpage Title", name: "webpageTitle", widget: "string"}
          - {label: "Job Title", name: "jobTitle", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Availability Status", name: "availability", widget: "string"}
          - {label: "Profile Photo", name: "photoUrl", widget: "image"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Description HTML", name: "descriptionHtml", widget: "text"}
          - {label: "Resume URL", name: "resumeUrl", widget: "string"}
          - {label: "Keywords", name: "keywords", widget: "string"}
          - label: "Social Media Links"
            name: "socials"
            widget: "list"
            fields:
              - {label: "Platform Name", name: "name", widget: "string"}
              - {label: "Profile URL", name: "url", widget: "string"}
              - {label: "Icon", name: "icon", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Show in Contact", name: "showInContact", widget: "boolean"}

      - file: "src/data/career.json"
        label: "Career History"
        name: "career_data"
        fields:
          - label: "Career Positions"
            name: "career"
            widget: "list"
            fields:
              - {label: "Job Title / Role", name: "title", widget: "string"}
              - {label: "Company / Organization", name: "company", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Start Date", name: "startDate", widget: "string"}
              - {label: "End Date", name: "endDate", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      - file: "src/data/projects.json"
        label: "Projects"
        name: "projects_data"
        fields:
          - label: "Project Items"
            name: "projects"
            widget: "list"
            fields:
              - {label: "Project Title", name: "title", widget: "string"}
              - {label: "Project Image", name: "image", widget: "image"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Date / Year", name: "date", widget: "string"}
